name: Test wildcard path pattern for PMD reports
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy multiple PMD report fixtures into workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pmd-reports/module-a"
          mkdir -p "$GITHUB_WORKSPACE/pmd-reports/module-b"
          cp "$GITHUB_WORKSPACE/tests/fixtures/pmd-with-violations.xml" \
             "$GITHUB_WORKSPACE/pmd-reports/module-a/pmd.xml"
          cp "$GITHUB_WORKSPACE/tests/fixtures/pmd-empty.xml" \
             "$GITHUB_WORKSPACE/pmd-reports/module-b/pmd.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: pmd-reports/**/pmd.xml
          token: ${{ github.token }}

      - name: Assert action ran with wildcard path (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with wildcard path pattern"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
